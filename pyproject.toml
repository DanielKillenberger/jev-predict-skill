[project]
name = "jev-predict-skill"
version = "0.1.0"
description = "Predict a skill's closed decision outcome with TypeSafe Jev without running that skill."
readme = "SKILL.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jev-predict-skill = "jev_predict_skill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
